per_listener_settings false
allow_anonymous false
password_file /mosquitto/run/passwd

# Xabarlar faqat jonli o'tkaziladi. Qurilma ON/OFF voqealarini o'zi
# faylga navbatlab turadi, shuning uchun broker'da saqlash shart emas.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
# Qaysi qurilma qachon ulangani/uzilgani logda ko'rinadi
connection_messages true

# Ichki tarmoq (mixtron-broker.railway.internal) - logger shu orqali ulanadi.
# TCP proxy bu portga ulanmagan, tashqaridan ko'rinmaydi.
listener 1883

# Tashqi TLS - ESP32 va ofis dasturi Railway TCP proxy orqali shu portga keladi.
# Sertifikat o'z-o'zidan imzolangan: ESP32 sertifikatni tekshirmaydi (CERT_NONE).
listener 8883
certfile /mosquitto/run/server.crt
keyfile /mosquitto/run/server.key
